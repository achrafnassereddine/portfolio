<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Route Not Found | Achraf Nasser-Eddine</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414;
            --surface: #191919;
            --border: #262626;
            --text: #eaeaea;
            --muted: #8a8a8a;
            --accent: #e30613;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 36px 32px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.74rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--text);
            color: var(--bg);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main class="card">
        <div class="tag"><span class="dot"></span> HTTP 404 // ROUTE UNMAPPED</div>
        <h1>Requested resource not found.</h1>
        <p>The path you requested does not exist on this host or has been relocated.</p>
        <a href="/">&larr; Return to Portfolio</a>
    </main>
</body>
</html>
